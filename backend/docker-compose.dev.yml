services:
  postgres:
    image: postgres:16
    container_name: openministry_postgres
    environment:
      POSTGRES_USER: openministry
      POSTGRES_PASSWORD: openministry123
      POSTGRES_DB: openministry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: openministry_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: