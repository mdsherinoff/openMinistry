services:
  postgres:
    image: postgres:16
    container_name: openministry_postgres
    environment:
      POSTGRES_USER: openministry
      POSTGRES_PASSWORD: CHANGE_THIS_PASSWORD
      POSTGRES_DB: openministry_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openministry -d openministry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openministry_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openministry_backend
    env_file:
      - ./backend/.env
    environment:
      MINER_URL: http://miner:8001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      miner:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://openministry.live
    container_name: openministry_frontend
    environment:
      NEXT_PUBLIC_API_URL: https://openministry.live
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: openministry_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf
      - /opt/openMinistry/certbot_data:/etc/letsencrypt
      - /opt/openMinistry/certbot_webroot:/var/www/certbot
    restart: unless-stopped
    depends_on:
      - backend
      - frontend

  certbot:
    image: certbot/certbot
    container_name: openministry_certbot
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openministry_worker
    command: celery -A workers.celery_app worker --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      MINER_URL: http://miner:8001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      miner:
        condition: service_started

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openministry_beat
    command: celery -A workers.celery_app beat --loglevel=info
    env_file:
      - ./backend/.env
    environment:
      MINER_URL: http://miner:8001
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      miner:
        condition: service_started

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openministry_flower
    command: celery -A workers.celery_app flower --port=5555
    env_file:
      - ./backend/.env
    ports:
      - "5555:5555"
    restart: unless-stopped
    depends_on:
      - redis

  miner:
    image: openministry_miner
    build:
      context: /opt/open-ministry-miner
      dockerfile: Dockerfile
    container_name: openministry_miner
    env_file:
      - /opt/open-ministry-miner/.env
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  postgres_data:
  certbot_data:
  certbot_webroot:
