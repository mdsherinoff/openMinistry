services:
  postgres:
    image: postgres:16
    container_name: openministry_postgres
    environment:
      POSTGRES_USER: openministry
      POSTGRES_PASSWORD: openministry123
      POSTGRES_DB: openministry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openministry -d openministry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: openministry_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openministry_backend
    environment:
      DATABASE_URL: postgresql+psycopg://openministry:openministry123@postgres:5432/openministry_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-in-production
      DEBUG: "True"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openministry_worker
    command: celery -A workers.celery_app worker --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://openministry:openministry123@postgres:5432/openministry_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-in-production
      DEBUG: "True"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openministry_beat
    command: celery -A workers.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: postgresql+psycopg://openministry:openministry123@postgres:5432/openministry_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-this-in-production
      DEBUG: "True"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openministry_flower
    command: celery -A workers.celery_app flower --port=5555
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: openministry_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
